<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23231C17%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%23E0D8C4%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | Студия массажа Ирины Битюковой</title>
<meta name="description" content="Такой страницы нет. Перейдите на главную: там цены и время визита, запись через YCLIENTS и контакты студии.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#231C17">
<style>
:root{--bg:#231C17;--ink:#E9E2D5;--ink-2:#CFC6B6;--cta:#E0D8C4;--cta-h:#EDE6D6;--cta-ink:#2A211B;--accent:#0ABAB5;--line:rgba(233,226,213,.32)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 20px;color:var(--ink);font:360 17px/1.62 "RF Text",Arial,sans-serif;font-stretch:112%;
  background:radial-gradient(90% 70% at 78% 18%,rgba(224,170,110,.16),transparent 62%),radial-gradient(70% 60% at 10% 100%,rgba(58,46,37,.9),transparent 70%),var(--bg)}
main{max-width:640px}
.rule{display:block;width:56px;height:1px;margin-bottom:28px;background:var(--accent)}
h1{margin:0 0 20px;font:260 clamp(40px,6vw,72px)/1.06 "RF Display",Verdana,sans-serif;font-stretch:151%;letter-spacing:-.012em;text-wrap:balance}
p{margin:0 0 36px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:2px;background:var(--cta);color:var(--cta-ink);
  font:540 14px/1 "RF Text",Arial,sans-serif;font-stretch:140%;letter-spacing:.06em;text-decoration:none;transition:background-color 200ms,transform 160ms}
.btn:hover{background:var(--cta-h)}
.btn:active{transform:scale(.98)}
.lnk{color:inherit;font:420 14px/1.2 "RF Text",Arial,sans-serif;font-stretch:140%;letter-spacing:.06em;text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:6px;text-decoration-color:var(--line);padding:14px 0}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:767px){.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <span class="rule" aria-hidden="true"></span>
  <h1>Такой страницы нет</h1>
  <p>Возможно, адрес набран с ошибкой. На главной цены и время визита, запись через YCLIENTS и контакты студии.</p>
  <div class="acts">
    <a class="btn" href="/" id="home">На главную</a>
    <a class="lnk" href="/#ceny" id="prices">Цены и время</a>
  </div>
</main>
<script>
(function(){var seg=location.pathname.split('/').filter(Boolean),base=location.hostname.endsWith('github.io')&&seg.length?'/'+seg[0]+'/':'/';
document.getElementById('home').href=base;document.getElementById('prices').href=base+'#ceny';
var s=document.createElement('style');s.textContent='@font-face{font-family:"RF Display";src:url('+base+'assets/fonts/rflex-display.woff2) format("woff2");font-weight:200 360;font-stretch:130% 151%;font-display:swap}'+
'@font-face{font-family:"RF Text";src:url('+base+'assets/fonts/rflex-text.woff2) format("woff2");font-weight:300 600;font-stretch:100% 151%;font-display:swap}';document.head.appendChild(s)})();
</script>
</body>
</html>
